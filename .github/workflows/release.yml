# 推送 v* tag 时：跑单元测试 → 用仓库 Secrets 里的密钥打签名 Release 包 → 创建 GitHub Release 并上传 APK。
#
# 需要在仓库 Settings → Secrets and variables → Actions 中配置：
#   KEYSTORE_BASE64    colorgrabber-release.jks 的 base64（base64 -w0 colorgrabber-release.jks）
#   KEYSTORE_PASSWORD  keystore.properties 中的 storePassword
#   KEY_ALIAS          keystore.properties 中的 keyAlias
#   KEY_PASSWORD       keystore.properties 中的 keyPassword
#
# Release 说明取自 docs/releases/<tag>.md（如 docs/releases/v1.1.md），不存在则自动生成。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 tag 与 versionName 一致
        run: |
          version=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 app/build.gradle.kts 的 versionName ($version) 不一致"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 安装 Android SDK 平台
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" > /dev/null

      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::缺少仓库 Secret $v"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > colorgrabber-release.jks
          {
            echo "storeFile=colorgrabber-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: 单元测试
        run: ./gradlew testDebugUnitTest

      - name: 打包签名 Release
        run: |
          ./gradlew assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then echo "::error::未生成已签名的 $apk"; exit 1; fi
          mv "$apk" "ColorGrabber-$GITHUB_REF_NAME.apk"

      - name: 选择 Release 说明
        id: notes
        run: |
          f="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        with:
          name: ColorGrabber ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: ColorGrabber-${{ github.ref_name }}.apk

      - name: 清理签名文件
        if: always()
        run: rm -f colorgrabber-release.jks keystore.properties
